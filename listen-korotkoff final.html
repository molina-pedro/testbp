<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen for Korotkoff Sounds — BP Practice</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c2b33;
    --bg-soft:#243944;
    --card:#f5f2ea;
    --ink-soft:#a9b6bd;
    --teal:#1f6f6b;
    --red:#b3392c;
    --good:#7fd9a0;
    --bad:#f0958a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(circle at 50% -10%, var(--bg-soft), var(--bg) 65%);
    font-family:'Inter',sans-serif; color:var(--card);
    display:flex; flex-direction:column; align-items:center;
    padding: 32px 18px 50px;
  }
  h1{ font-size: clamp(22px,4vw,30px); margin:0 0 4px; text-align:center; letter-spacing:-0.01em;}
  .sub{ color:var(--ink-soft); font-size:14px; margin:0 0 26px; text-align:center; max-width:460px; line-height:1.5;}

  .layout{
    display:flex; flex-direction:column; align-items:center;
    gap:8px; width:100%;
  }
  .container-gauge, .container-answer{
    display:flex; flex-direction:column; align-items:center;
  }

  .gauge-shell{
    width: min(88vw, 320px); aspect-ratio:1;
    border-radius:50%;
    background: linear-gradient(155deg,#e6e8ea,#9aa0a6 55%,#6b7076);
    padding: 14px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(255,255,255,0.15);
    position:relative;
  }
  .gauge-face{ width:100%; height:100%; border-radius:50%; background:#fbfaf6; box-shadow: inset 0 2px 10px rgba(0,0,0,0.15); }

  .readout{ margin-top:14px; font-family:'IBM Plex Mono',monospace; text-align:center; }
  .readout .num{ font-size:30px; font-weight:700; }
  .readout .unit{ font-size:13px; color:var(--ink-soft); margin-left:4px;}

  .status{
    margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; gap:8px; min-height:18px;
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:#3a4a52; transition:background .08s, transform .08s;}
  .dot.beat{ background:var(--red); transform:scale(1.6);}

  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px;
    border:none; border-radius:10px; padding:13px 22px; cursor:pointer;
    transition: transform .05s ease, filter .15s ease, opacity .15s ease;
  }
  button:active{ transform:scale(0.96); }
  button:disabled{ opacity:.35; cursor:not-allowed; }

  #startBtn{ background:var(--teal); color:#fff; margin-top:22px; }
  #startBtn:hover{ filter:brightness(1.1); }

  .guess-row{ display:flex; gap:16px; margin-top:22px; flex-wrap:wrap; justify-content:center; }
  .guess-field{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .guess-field label{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
  .guess-field input{
    width:110px; font-size:24px; text-align:center; padding:9px 8px;
    font-family:'IBM Plex Mono',monospace; font-weight:700;
    border-radius:10px; border:2px solid #3a4a52; background:#0f1a1f; color:var(--card);
    outline:none;
  }
  .guess-field input:focus{ border-color:var(--teal); }
  .guess-field input::-webkit-outer-spin-button,
  .guess-field input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .guess-field input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  #checkBtn{ background:var(--teal); color:#fff; margin-top:18px; }
  #checkBtn:hover{ filter:brightness(1.1); }

  .feedback{ margin-top:20px; font-family:'IBM Plex Mono',monospace; font-size:14px; text-align:center; max-width:420px; line-height:1.6;}
  .result-grid{ display:flex; gap:20px; margin-top:14px; justify-content:center; flex-wrap:wrap;}
  .result-box{ background:#0f1a1f; border:1px solid #3a4a52; border-radius:10px; padding:12px 18px; text-align:center;}
  .result-box .label{ font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px;}
  .result-box .val{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700;}
  .result-box .actual{ font-size:11.5px; color:var(--ink-soft); margin-top:3px;}

  footer{ margin-top:36px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#5c6b73; text-align:center;}

  /* Stack the two containers horizontally once there's room; vertical (default) below that */
  @media (min-width: 780px){
    .layout{
      flex-direction:row; align-items:flex-start; justify-content:center;
      /* gap:48px; */
      gap:0px;
    }
    .container-answer{ 
      padding-top:36px; 
      width: 420px; 
      /* the fix is width */
    }
  }
</style>
</head>
<body>

  <h1>Listen for Korotkoff Sounds</h1>
  <div class="sub">Press start, listen for the taps, then type in the systolic and diastolic values</div>

  <div class="layout">
    <div class="container-gauge">
      <div class="gauge-shell"><div class="gauge-face" id="gaugeFace"></div></div>

      <div class="readout"><span class="num" id="pressureNum">0</span><span class="unit">mmHg</span></div>
      <div class="status"><span class="dot" id="pulseDot"></span><span id="statusText">press start</span></div>

      <button id="startBtn">▶ Start reading</button>
    </div>

    <div class="container-answer">
      <div class="guess-row" id="guessRow">
        <div class="guess-field">
          <label for="sysInput">Systolic</label>
          <input type="number" id="sysInput" inputmode="numeric" placeholder="—" disabled maxlength="3">
        </div>
        <div class="guess-field">
          <label for="diaInput">Diastolic</label>
          <input type="number" id="diaInput" inputmode="numeric" placeholder="—" disabled maxlength="3">
        </div>
      </div>
      <button id="checkBtn" disabled>Check my answer</button>

      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <footer>Simulated training tool for educational practice only.</footer>

<script>
(function(){
  "use strict";
  const GMIN=0, GMAX=300;
  const ANGLE_MIN=-150, ANGLE_MAX=150;
  const PEAK = 160;
  const HR = 74; // beats per minute, fixed cadence
  const DEFLATE_RATE = 6; // mmHg/sec
  const INFLATE_RATE = 90; // mmHg/sec (quick auto-pump)
  const GAUGE = { size:300, cx:150, cy:150, rFace:138, rTickOuter:124, rNum:104 };

  const gaugeFace = document.getElementById('gaugeFace');
  const pressureNum = document.getElementById('pressureNum');
  const statusText = document.getElementById('statusText');
  const pulseDot = document.getElementById('pulseDot');
  const startBtn = document.getElementById('startBtn');
  const guessRow = document.getElementById('guessRow');
  const sysInput = document.getElementById('sysInput');
  const diaInput = document.getElementById('diaInput');
  const checkBtn = document.getElementById('checkBtn');
  const feedback = document.getElementById('feedback');

  let pressure = 0;
  let phase = 'idle'; // idle | inflating | holding | deflating | done
  let audioCtx = null;
  let beatTimer = null;
  let rafId = null, lastT = null;

  let trueSys = null, trueDia = null;

  function buildGauge(){
    const {size, cx, cy, rFace, rTickOuter, rNum} = GAUGE;
    let svg = `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" style="overflow:visible;">`;
    svg += `<circle cx="${cx}" cy="${cy}" r="${rFace}" fill="#fbfaf6" stroke="#c7c2b4" stroke-width="2"/>`;
    for(let v=GMIN; v<=GMAX; v+=2){
      const angle = ANGLE_MIN + (v-GMIN)/(GMAX-GMIN)*(ANGLE_MAX-ANGLE_MIN);
      const rad = (angle-90)*Math.PI/180;
      const major = v % 20 === 0;
      const mid = !major && v % 10 === 0;
      const r1 = rTickOuter;
      const r2 = major ? rTickOuter-16 : (mid ? rTickOuter-11 : rTickOuter-6);
      const x1=cx+r1*Math.cos(rad), y1=cy+r1*Math.sin(rad);
      const x2=cx+r2*Math.cos(rad), y2=cy+r2*Math.sin(rad);
      const color = v>=180 ? '#8a2f24' : '#232323';
      svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${major?2.4:1}"/>`;
      if(major){
        const xn=cx+rNum*Math.cos(rad), yn=cy+rNum*Math.sin(rad);
        svg += `<text x="${xn.toFixed(1)}" y="${yn.toFixed(1)}" font-size="15" font-family="IBM Plex Mono, monospace" font-weight="600" fill="${color}" text-anchor="middle" dominant-baseline="middle">${v}</text>`;
      }
    }
    svg += `<text x="${cx}" y="${cy-38}" font-size="10.5" font-family="Inter, sans-serif" fill="#8a8578" text-anchor="middle" letter-spacing="1">mmHg</text>`;
    svg += `<g id="markerGroup"></g>`;
    svg += `<g id="needleGroup" style="transform-origin:${cx}px ${cy}px;">
              <polygon points="${cx-2.6},${cy} ${cx+2.6},${cy} ${cx+1.2},${cy-rTickOuter+4} ${cx-1.2},${cy-rTickOuter+4}" fill="#b3392c"/>
              <polygon points="${cx-4},${cy} ${cx+4},${cy} ${cx},${cy+14}" fill="#b3392c"/>
            </g>`;
    svg += `<circle cx="${cx}" cy="${cy}" r="6" fill="#2a2a2a"/><circle cx="${cx}" cy="${cy}" r="2.4" fill="#c9a063"/>`;
    svg += `</svg>`;
    gaugeFace.innerHTML = svg;
  }
  buildGauge();

  function angleForValue(v){
    const clamped = Math.max(GMIN, Math.min(GMAX, v));
    return ANGLE_MIN + (clamped-GMIN)/(GMAX-GMIN)*(ANGLE_MAX-ANGLE_MIN);
  }

  function clearAnswerMarkers(){
    const g = gaugeFace.querySelector('#markerGroup');
    if(g) g.innerHTML = '';
  }

  function drawAnswerMarker(value, color, label){
    const g = gaugeFace.querySelector('#markerGroup');
    if(!g) return;
    const {cx, cy, rTickOuter} = GAUGE;
    const angle = angleForValue(value);
    const rad = (angle-90)*Math.PI/180;
    const rInner = 30, rOuter = rTickOuter + 10;
    const x1 = cx + rInner*Math.cos(rad), y1 = cy + rInner*Math.sin(rad);
    const x2 = cx + rOuter*Math.cos(rad), y2 = cy + rOuter*Math.sin(rad);
    const ns = 'http://www.w3.org/2000/svg';
    const line = document.createElementNS(ns,'line');
    line.setAttribute('x1', x1.toFixed(1)); line.setAttribute('y1', y1.toFixed(1));
    line.setAttribute('x2', x2.toFixed(1)); line.setAttribute('y2', y2.toFixed(1));
    line.setAttribute('stroke', color); line.setAttribute('stroke-width', '3');
    line.setAttribute('stroke-linecap', 'round');
    g.appendChild(line);

    if(label){
      const lx = cx + (rOuter+16)*Math.cos(rad), ly = cy + (rOuter+16)*Math.sin(rad);
      const text = document.createElementNS(ns,'text');
      text.setAttribute('x', lx.toFixed(1)); text.setAttribute('y', ly.toFixed(1));
      text.setAttribute('font-size','11'); text.setAttribute('font-family','IBM Plex Mono, monospace');
      text.setAttribute('font-weight','700'); text.setAttribute('fill', color);
      text.setAttribute('text-anchor','middle'); text.setAttribute('dominant-baseline','middle');
      text.setAttribute('stroke', '#fbfaf6'); text.setAttribute('stroke-width', '4');
      text.setAttribute('paint-order', 'stroke');
      text.textContent = label;
      g.appendChild(text);
    }
  }

  let needleKick = 0;      // temporary recoil offset in degrees
  let needleKickVel = 0;   // recoil velocity, for spring physics

  function setNeedle(v){
    const clamped = Math.max(GMIN, Math.min(GMAX, v));
    const baseAngle = ANGLE_MIN + (clamped-GMIN)/(GMAX-GMIN)*(ANGLE_MAX-ANGLE_MIN);
    gaugeFace.querySelector('#needleGroup').style.transform = `rotate(${baseAngle+needleKick}deg)`;
    pressureNum.textContent = Math.round(clamped);
  }

  function kickNeedle(strength){
    // strength 0..1 — needle jolts upward (higher pressure) with each heart sound, then eases back
    needleKickVel += 55 + strength*35;
  }

  function updateKickSpring(dt){
    // critically-damped spring pulling needleKick back to 0
    const stiffness = 140, damping = 22;
    const accel = -stiffness*needleKick - damping*needleKickVel;
    needleKickVel += accel*dt;
    needleKick += needleKickVel*dt;
    if(Math.abs(needleKick) < 0.03 && Math.abs(needleKickVel) < 0.3){ needleKick = 0; needleKickVel = 0; }
  }

  setNeedle(0); // initialize needle at 0 mmHg on load

  function ensureAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }

  function playTap(intensity){
    if(!audioCtx || intensity<=0) return;
    const t0 = audioCtx.currentTime, dur=0.16;
    const bufferSize = audioCtx.sampleRate*dur;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i]=(Math.random()*2-1)*Math.pow(1-i/bufferSize,2); }
    const noise = audioCtx.createBufferSource(); noise.buffer=buffer;
    const bp = audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=120+intensity*40; bp.Q.value=1.1;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(1.0*intensity, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    noise.connect(bp).connect(g).connect(audioCtx.destination);
    noise.start(t0); noise.stop(t0+dur);

    const osc = audioCtx.createOscillator(); osc.type='sine'; osc.frequency.value=90;
    const og = audioCtx.createGain();
    og.gain.setValueAtTime(0,t0);
    og.gain.linearRampToValueAtTime(0.65*intensity, t0+0.006);
    og.gain.exponentialRampToValueAtTime(0.001, t0+dur*0.9);
    osc.connect(og).connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur*0.9);
  }

  function intensityAt(p){
    if(p>=trueSys || p<=trueDia) return 0;
    const span = trueSys-trueDia;
    const posFromTop = (trueSys-p)/span;
    let i;
    if(posFromTop<0.15) i = 0.55+(posFromTop/0.15)*0.3;
    else if(posFromTop>0.8) i = 0.7*(1-(posFromTop-0.8)/0.2) + 0.15;
    else i = 0.9;
    return Math.max(0,Math.min(1,i));
  }

  function beatTick(){
    pulseDot.classList.add('beat');
    setTimeout(()=>pulseDot.classList.remove('beat'),110);
    if(phase!=='deflating') return;
    const inten = intensityAt(pressure);
    if(inten>0){ playTap(inten); kickNeedle(inten); statusText.textContent='tap heard'; }
    else statusText.textContent = pressure>trueDia ? 'listening…' : 'silent';
  }

  function startBeats(){
    stopBeats();
    beatTimer = setInterval(beatTick, 60000/HR);
  }
  function stopBeats(){ if(beatTimer){ clearInterval(beatTimer); beatTimer=null; } }

  function frame(ts){
    if(lastT==null) lastT=ts;
    let dt = (ts-lastT)/1000; lastT=ts;
    dt = Math.min(dt, 0.05); // guard against long frame gaps destabilizing the spring

    updateKickSpring(dt);

    if(phase==='inflating'){
      pressure = Math.min(PEAK, pressure + INFLATE_RATE*dt);
      setNeedle(pressure);
      if(pressure>=PEAK){
        phase='holding';
        setTimeout(()=>{
          if(phase==='holding'){
            phase='deflating';
            statusText.textContent='listening…';
          }
        }, 500);
      }
      rafId=requestAnimationFrame(frame); return;
    }
    if(phase==='holding'){ setNeedle(pressure); rafId=requestAnimationFrame(frame); return; }
    if(phase==='deflating'){
      pressure = Math.max(0, pressure - DEFLATE_RATE*dt);
      setNeedle(pressure);
      if(pressure<=0){
        pressure=0; needleKick=0; needleKickVel=0; setNeedle(0);
        concludeAuto();
        return;
      }
      rafId=requestAnimationFrame(frame); return;
    }
  }

  function pickValues(){
    // systolic random within a plausible range, diastolic a plausible gap below
    trueSys = 100 + Math.round(Math.random()*50);      // 100-150
    const gap = 30 + Math.round(Math.random()*20);      // 30-50 pulse pressure
    trueDia = Math.max(50, trueSys - gap);
  }

  startBtn.addEventListener('click', ()=>{
    ensureAudio();
    pickValues();
    pressure=0; needleKick=0; needleKickVel=0; setNeedle(0);
    clearAnswerMarkers();
    sysInput.value=''; diaInput.value='';
    sysInput.disabled=false; diaInput.disabled=false;
    checkBtn.disabled=false;
    feedback.innerHTML='';
    startBtn.disabled=true;
    phase='inflating';
    statusText.textContent='inflating…';
    lastT=null;
    startBeats();
    rafId=requestAnimationFrame(frame);
  });

  function concludeAuto(){
    phase='done';
    stopBeats();
    startBtn.disabled=false;
    statusText.textContent='cuff empty — enter your reading';
    sysInput.focus();
  }

  function checkAnswer(){
    const gSys = parseFloat(sysInput.value);
    const gDia = parseFloat(diaInput.value);
    if(isNaN(gSys) || isNaN(gDia)){
      feedback.innerHTML = `<div style="color:var(--bad)">Enter both a systolic and diastolic guess.</div>`;
      return;
    }
    const errSys = Math.abs(gSys-trueSys);
    const errDia = Math.abs(gDia-trueDia);
    const sysHtml = `<div class="result-box"><div class="label">Systolic</div><div class="val" style="color:${errSys<=4?'var(--good)':'var(--bad)'}">${gSys}</div><div class="actual">actual ${trueSys} (Δ${errSys})</div></div>`;
    const diaHtml = `<div class="result-box"><div class="label">Diastolic</div><div class="val" style="color:${errDia<=4?'var(--good)':'var(--bad)'}">${gDia}</div><div class="actual">actual ${trueDia} (Δ${errDia})</div></div>`;

    let verdict;
    if(errSys<=4 && errDia<=4) verdict='Correct — right on target.';
    else if(errSys<=8 && errDia<=8) verdict='Close — within a normal margin of error.';
    else verdict='Off — listen again for the exact onset and disappearance of sound.';

    feedback.innerHTML = `<div class="result-grid">${sysHtml}${diaHtml}</div><div style="margin-top:14px;">${verdict}</div>`;
    checkBtn.disabled=true;
    sysInput.disabled=true; diaInput.disabled=true;

    clearAnswerMarkers();
    drawAnswerMarker(trueSys, '#b3392c', 'SYS ' + Math.round(trueSys));
    drawAnswerMarker(trueDia, '#2c5a5c', 'DIA ' + Math.round(trueDia));
  }

  checkBtn.addEventListener('click', checkAnswer);
  diaInput.addEventListener('keydown', e=>{ if(e.key==='Enter') checkAnswer(); });

  // Cap entry to 3 digits and strip any non-digit characters (e, +, -, . are
  // otherwise legal in a type="number" field)
  [sysInput, diaInput].forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(['e','E','+','-','.'].includes(e.key)) e.preventDefault();
    });
    inp.addEventListener('input', ()=>{
      let digitsOnly = inp.value.replace(/[^0-9]/g, '');
      if(digitsOnly.length > 3) digitsOnly = digitsOnly.slice(0, 3);
      inp.value = digitsOnly;
    });
    inp.addEventListener('paste', e=>{
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text');
      const digitsOnly = text.replace(/[^0-9]/g, '').slice(0, 3);
      inp.value = digitsOnly;
    });
  });

  // Prevent scroll-wheel from changing the number inputs
  [sysInput, diaInput].forEach(inp=>{
    inp.addEventListener('wheel', e=>{ e.preventDefault(); }, { passive:false });
  });

})();
</script>
</body>
</html>
